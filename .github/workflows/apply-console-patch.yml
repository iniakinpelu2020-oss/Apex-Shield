name: apply-console-patch

# The four biggest console files are too large to send through the API in one
# payload, so they travel as a gzipped git patch and are applied here once.
# This workflow deletes itself and patch/ in the same push.

on: push

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Rebuild the files from the payload
        run: |
          set -euo pipefail
          parts=$(ls patch/p*.b64 | wc -l)
          echo "parts: $parts"
          test "$parts" -ge 8
          cat patch/p*.b64 | tr -d '\n' | base64 -d | gunzip > /tmp/console.patch
          wc -c /tmp/console.patch
          git apply --whitespace=nowarn /tmp/console.patch
          ls -l index.html apk.js app.js styles.css
          node --check core.js
          node --check apk.js
          node --check app.js

      - name: Commit, then remove the scaffolding
        run: |
          set -euo pipefail
          git config user.name "apex-shield-bot"
          git config user.email "apex-shield-bot@users.noreply.github.com"
          git add index.html apk.js app.js styles.css
          git commit -m "Add the Shield console: page, theme, APK parser and triage logic"
          git rm -r --quiet .github patch
          git commit -m "Remove the one-shot patch scaffolding"
          git push
